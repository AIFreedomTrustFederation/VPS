name: Build AIFT Android Runtime APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/aift-cloud-runtime/**'
      - 'scripts/aift-android-runtime-bootstrap.sh'
      - '.github/workflows/aift-android-runtime-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-runtime-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Bootstrap Gradle files
        run: bash scripts/aift-android-runtime-bootstrap.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android/aift-cloud-runtime
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aift-cloud-runtime-debug-apk
          path: android/aift-cloud-runtime/app/build/outputs/apk/debug/app-debug.apk
