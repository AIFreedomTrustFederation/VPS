name: Node Agent Installer Secret Safety

on:
  push:
    branches: [main]
    paths:
      - scripts/install-node-agent.sh
      - tests/test_node_agent_installer_secrets.py
      - .github/workflows/node-agent-installer-secrets.yml
  pull_request:
    paths:
      - scripts/install-node-agent.sh
      - tests/test_node_agent_installer_secrets.py
      - .github/workflows/node-agent-installer-secrets.yml

permissions:
  contents: read

jobs:
  installer-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate installer shell syntax
        run: bash -n scripts/install-node-agent.sh
      - name: Verify real isolated root installer operations
        run: sudo -n python3 -B -m unittest discover -s tests -p 'test_node_agent_installer_secrets.py' -v
