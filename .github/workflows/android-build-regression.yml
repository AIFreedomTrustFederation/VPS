name: Android build regression

on:
  pull_request:
    paths:
      - 'scripts/aift-build-android-runtime.sh'
      - 'tests/test-android-build.sh'
      - '.github/workflows/android-build-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/aift-build-android-runtime.sh'
      - 'tests/test-android-build.sh'
      - '.github/workflows/android-build-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n scripts/aift-build-android-runtime.sh tests/test-android-build.sh
      - name: Verify Android build failure handling
        run: bash tests/test-android-build.sh
