name: Deploy AIFT Dashboard to VPS

# Manual production deploy / rollback. Disabled unless the repository variable
# VPS_DEPLOY_ENABLED is exactly 'true'. A manual run FAILS (never skips quietly)
# when deployment is disabled, run from a ref other than main, or any required
# secret is missing. See docs/github-secrets.md and docs/deploy-rollback.md.
on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Optional rollback: full 40-character SHA of a commit already on main. Leave empty to deploy this run''s commit.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Build and verification never depend on production deployment authorization.
  verify-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aift-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Build before deploy
        run: npm run build

  deploy-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Check deployment authorization
        id: gate
        env:
          GATE_ENABLED: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_FULL: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          if [ "$GATE_ENABLED" = "true" ] && [ "$REF_FULL" = "refs/heads/main" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Manual deploy refused: repository variable VPS_DEPLOY_ENABLED must be exactly 'true' and the run must be on refs/heads/main." >&2
            exit 1
          fi
          echo "::notice::Deploy skipped: VPS_DEPLOY_ENABLED is not 'true' or the ref is not main."

  deploy-dashboard:
    needs: [verify-dashboard, deploy-gate]
    if: needs.deploy-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://vps.aifreedomtrust.com
    concurrency:
      group: vps-dashboard-deploy
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate deployment configuration
        run: bash scripts/deploy-dashboard-runner.sh validate

      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: bash scripts/deploy-dashboard-runner.sh resolve-target

      - name: Configure SSH
        run: bash scripts/deploy-dashboard-runner.sh ssh-setup

      - name: Deploy dashboard to Sacramento Node 001
        id: deploy
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_ROLLBACK: ${{ steps.target.outputs.rollback }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/deploy-dashboard-runner.sh deploy

      - name: Record deployment provenance
        if: always() && steps.deploy.conclusion != 'skipped'
        run: bash scripts/deploy-dashboard-runner.sh summarize

      - name: Upload deployment record
        if: always() && steps.deploy.conclusion != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-dashboard-deployment-record-${{ github.run_id }}
          path: deployment-record.json
          if-no-files-found: ignore
