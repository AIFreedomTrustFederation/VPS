name: Release AIFT Android Runtime APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/aift-cloud-runtime/**'
      - 'scripts/aift-android-runtime-bootstrap.sh'
      - '.github/workflows/aift-android-runtime-release.yml'

permissions:
  contents: write

concurrency:
  group: android-runtime-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Bootstrap Android runtime build files
        run: bash scripts/aift-android-runtime-bootstrap.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android/aift-cloud-runtime
        run: gradle assembleDebug

      - name: Prepare release APK
        run: |
          mkdir -p dist
          cp android/aift-cloud-runtime/app/build/outputs/apk/debug/app-debug.apk dist/aift-cloud-runtime-debug.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: aift-cloud-runtime-latest
          name: AIFT Cloud Runtime Latest
          body: |
            Latest debug APK for the AIFT Cloud Android Runtime.

            Download the APK asset below and install it on Android.
          files: dist/aift-cloud-runtime-debug.apk
          draft: false
          prerelease: true
          make_latest: true
