name: AIFT Auto Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'apps/aift-dashboard/**'
      - 'registry-examples/**'
      - '.github/workflows/aift-auto-pipeline.yml'
      - 'scripts/deploy-dashboard-remote.sh'
      - 'scripts/deploy-dashboard-runner.sh'
      - 'tests/test-dashboard-deploy-revision.py'
  pull_request:
    paths:
      - 'apps/aift-dashboard/**'
      - 'registry-examples/**'
      - '.github/workflows/aift-auto-pipeline.yml'
      - 'scripts/deploy-dashboard-remote.sh'
      - 'scripts/deploy-dashboard-runner.sh'
      - 'tests/test-dashboard-deploy-revision.py'
  workflow_dispatch:

permissions:
  contents: read

# Build and verification run on every push and never depend on production
# deployment authorization. Deployment is disabled unless the repository variable
# VPS_DEPLOY_ENABLED is exactly 'true'. When it is enabled, a push run FAILS if
# any required secret is missing; when it is disabled, a push run skips deploy
# with a notice and a manual run fails. See docs/github-secrets.md.
jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aift-dashboard
    env:
      AIFT_REGISTRY_PATH: /tmp/aift/registry/apps.yml
      AIFT_NODES_PATH: /tmp/aift/registry/nodes.yml
      AIFT_TEMPLATES_PATH: /tmp/aift/registry/templates.yml
      AIFT_BUILDS_PATH: /tmp/aift/registry/builds.yml
      AIFT_DEPLOYMENTS_PATH: /tmp/aift/registry/deployments.yml
      AIFT_LOG_PATH: /tmp/aift/logs
      AIFT_DASHBOARD_TOKEN: test-dashboard-token
      AIFT_NODE_TOKEN: test-node-token
      COOLIFY_URL: https://example.invalid
      COOLIFY_API_TOKEN: test-coolify-token
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Prepare registry files
        run: |
          mkdir -p /tmp/aift/registry /tmp/aift/logs ../../ops/build-reports
          cp ../../registry-examples/nodes.yml /tmp/aift/registry/nodes.yml
          cp ../../registry-examples/templates.yml /tmp/aift/registry/templates.yml
          cp ../../registry-examples/builds.yml /tmp/aift/registry/builds.yml
          cp ../../registry-examples/deployments.yml /tmp/aift/registry/deployments.yml
          cat > /tmp/aift/registry/apps.yml <<'EOF'
          apps:
            aift-dashboard:
              repo: https://github.com/AIFreedomTrustFederation/VPS
              branch: main
              domain: vps.aifreedomtrust.com
              framework: nextjs
              status: running
              node: sacramento-node-001
              trust_class: business-app
          EOF

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Build dashboard
        run: |
          set +e
          npm run build > ../../ops/build-reports/dashboard-build.log 2>&1
          code=$?
          {
            echo "# AIFT Auto Pipeline Build"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Exit code: $code"
            if [ "$code" = "0" ]; then
              echo "Status: passed"
            else
              echo "Status: failed"
            fi
          } > ../../ops/build-reports/latest-dashboard-build.md
          exit $code

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aift-auto-pipeline-build-report
          path: |
            ops/build-reports/latest-dashboard-build.md
            ops/build-reports/dashboard-build.log

  deploy-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/deploy-dashboard-runner.sh
          sparse-checkout-cone-mode: false

      - name: Check deployment authorization
        id: gate
        env:
          # Raw value: compared byte-for-byte (case-sensitive) by the script.
          VPS_DEPLOY_ENABLED_RAW: ${{ vars.VPS_DEPLOY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REF_FULL: ${{ github.ref }}
        run: bash scripts/deploy-dashboard-runner.sh gate

  deploy-dashboard:
    needs: [build-dashboard, deploy-gate]
    if: needs.deploy-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://vps.aifreedomtrust.com
    concurrency:
      group: vps-dashboard-deploy
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        run: bash scripts/deploy-dashboard-runner.sh validate

      - name: Resolve deploy target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROLLBACK_SHA: ''
        run: bash scripts/deploy-dashboard-runner.sh resolve-target

      - name: Configure SSH
        run: bash scripts/deploy-dashboard-runner.sh ssh-setup

      - name: Deploy to node one
        id: deploy
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_ROLLBACK: ${{ steps.target.outputs.rollback }}
          DEPLOY_EVENT: ${{ github.event_name }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/deploy-dashboard-runner.sh deploy

      - name: Record deployment provenance
        if: always() && steps.deploy.conclusion != 'skipped'
        run: bash scripts/deploy-dashboard-runner.sh summarize

      - name: Upload deployment record
        if: always() && steps.deploy.conclusion != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vps-dashboard-deployment-record-${{ github.run_id }}
          path: deployment-record.json
          if-no-files-found: ignore
