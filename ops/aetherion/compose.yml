# AIFT VPS: model-only runtime. NO GitHub runner, write credentials, or public AI API.
# Requires an operator-verified digest and a pre-existing, private model import directory.
name: aift-aetherion
services:
  ollama:
    image: "ollama/ollama@${AIFT_OLLAMA_IMAGE_DIGEST:?Set an operator-verified sha256 digest}"
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434" # only inside container; host port remains loopback
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "1024"
      OLLAMA_KEEP_ALIVE: "0"
    volumes:
      - ollama-store:/root/.ollama
      - "${AIFT_MODEL_IMPORT_DIR:?Set absolute model import directory}:/aift-import:ro"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: "${AIFT_OLLAMA_MEMORY_LIMIT:-6g}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Docker health proves only that the Ollama API answers; not model availability.
volumes:
  ollama-store:
